<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 防閃爍（同我畫你猜 plan/home-page.md 決策 5）：CSS 套用前先設 data-theme。有重連憑證 → 所選殼層 id（原字串，main.tsx 隨後修正）；沒有或任何例外 → home
      try {
        var t = sessionStorage.getItem('fishing-work:draw-contest:session') !== null ? localStorage.getItem('fishing-work:draw-contest:shell') || 'ppt' : 'home'
      } catch (e) {
        t = 'home'
      }
      document.documentElement.setAttribute('data-theme', t)
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fishing-work</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
