# fishing-work 容器部署（plan/docker-deploy.md 決策 4、spec/architecture.md §3「Docker 部署」）
# 啟動：docker compose up -d --build
# 主機埠被占用時：HOST_PORT=8080 docker compose up -d --build（網址要帶 :8080）
services:
  fishing-work:
    build: .
    image: fishing-work:latest
    ports:
      - "${HOST_PORT:-80}:80"
    environment:
      # 可選：給同事的分享網址＝站台根網址（遊戲清單），例如 http://192.168.1.50/；程式只取 origin，舊值 http://192.168.1.50/draw-guess/ 仍相容（沒設時為空字串，程式視為未設）
      PUBLIC_URL: ${PUBLIC_URL:-}
      # 繪圖比賽的評分器（spec/draw-contest/architecture.md §3）：ollama（預設；連不上時每回合自動退回隨機）或 random（沒有 Ollama 的機器）
      JUDGE: ${JUDGE:-ollama}
      # 容器內連主機的 Ollama；Linux 主機的 Ollama 需以 OLLAMA_HOST=0.0.0.0 啟動
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      # Ollama 裡的模型 tag（ollama list 可查）；換 clef-flash 時改此值
      JUDGE_MODEL: ${JUDGE_MODEL:-clef:27b-nvfp4}
      # 繪圖比賽的評語器（Epic 15，spec/draw-contest/architecture.md §3、§6.1）：ollama（預設；gemma4 產メスガキ評語）或 off（沒有 gemma4 或記憶體不足的機器，例如 32 GB）
      # 兩個模型同時常駐約 71 GB；連不上時該回合沒有評語，分數與揭曉不受影響
      COMMENT: ${COMMENT:-ollama}
      # 評語用的 Ollama 模型 tag（位址同 OLLAMA_URL）
      COMMENT_MODEL: ${COMMENT_MODEL:-gemma4:26b-mlx-bf16}
      # 單張評語逾時（毫秒）；逾時那張沒有評語，本回合剩餘各張跳過
      COMMENT_TIMEOUT_MS: ${COMMENT_TIMEOUT_MS:-20000}
    # Linux 需要此對應才解析得到 host.docker.internal；macOS／Windows 的 Docker Desktop 本來就有
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
