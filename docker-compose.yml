# fishing-work 容器部署（plan/docker-deploy.md 決策 4、spec/architecture.md §3「Docker 部署」）
# 啟動：docker compose up -d --build
# 主機埠被占用時：HOST_PORT=8080 docker compose up -d --build（網址要帶 :8080）
services:
  fishing-work:
    build: .
    image: fishing-work:latest
    ports:
      - "${HOST_PORT:-80}:80"
    environment:
      # 可選：給同事的分享網址＝站台根網址（遊戲清單），例如 http://192.168.1.50/；程式只取 origin，舊值 http://192.168.1.50/draw-guess/ 仍相容（沒設時為空字串，程式視為未設）
      PUBLIC_URL: ${PUBLIC_URL:-}
      # 繪圖比賽的評分器（spec/draw-contest/architecture.md §3）：ollama（預設；連不上時每回合自動退回隨機）或 random（沒有 Ollama 的機器）
      JUDGE: ${JUDGE:-ollama}
      # 容器內連主機的 Ollama；Linux 主機的 Ollama 需以 OLLAMA_HOST=0.0.0.0 啟動
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      # Ollama 裡的模型 tag（ollama list 可查）；換 clef-flash 時改此值
      JUDGE_MODEL: ${JUDGE_MODEL:-clef:27b-nvfp4}
      # 繪圖比賽的評語器（Epic 15，spec/draw-contest/architecture.md §3、§6.1）：ollama（預設；gemma4 產メスガキ評語）或 off（沒有 gemma4 或記憶體不足的機器，例如 32 GB）
      # 兩個模型同時常駐約 71 GB；連不上時該回合沒有評語，分數與揭曉不受影響
      COMMENT: ${COMMENT:-ollama}
      # 評語用的 Ollama 模型 tag（位址同 OLLAMA_URL）
      COMMENT_MODEL: ${COMMENT_MODEL:-gemma4:26b-mlx-bf16}
      # 單張評語逾時（毫秒）；逾時只影響那一張，同一回合連續兩次失敗才跳過本回合剩餘各張；第一名稱讚版失敗時退回一般評語
      COMMENT_TIMEOUT_MS: ${COMMENT_TIMEOUT_MS:-30000}
      # 猜歌的題庫（Epic 16，spec/song-guess/architecture.md §3）：server 向 Apple iTunes Search API 搜尋歌手（免金鑰）
      # 容器必須能連外網到 itunes.apple.com（https）；連不上時出題回「搜尋失敗」，其他兩款遊戲不受影響
      # 試聽檔由每位玩家的瀏覽器直接向 Apple 取，不經容器：同事的電腦也要能連到 Apple 的試聽檔網域
      # iTunes Search API 根網址；協定測試才會指到假 iTunes（user/mock/itunes.mjs）
      ITUNES_URL: ${ITUNES_URL:-https://itunes.apple.com}
      # 商店區域（決定搜得到哪些歌與歌名語言；排行榜的 lookup 也用它，榜單國家由來源決定）
      ITUNES_COUNTRY: ${ITUNES_COUNTRY:-TW}
      # 排行榜 RSS 根網址（Epic 18：台灣熱門＝tw 榜、西洋熱門＝us 榜）；容器也要能連到 rss.marketingtools.apple.com（https）
      ITUNES_RSS_URL: ${ITUNES_RSS_URL:-https://rss.marketingtools.apple.com}
      # 搜尋與排行榜 lookup 的逾時（毫秒）；逾時回「搜尋失敗」或「取得排行榜失敗」，出題者可重試
      ITUNES_TIMEOUT_MS: ${ITUNES_TIMEOUT_MS:-8000}
      # 排行榜 RSS 那一段的逾時（毫秒；Apple RSS 偶發 8～15 秒才回；lookup 仍用 ITUNES_TIMEOUT_MS；Epic 18）
      ITUNES_RSS_TIMEOUT_MS: ${ITUNES_RSS_TIMEOUT_MS:-12000}
      # 歌手搜尋結果與排行榜快取（毫秒，預設 10 分鐘）；iTunes 每 IP 約 20 次／分鐘，同一歌手、同一榜單再出題不重打
      ITUNES_CACHE_MS: ${ITUNES_CACHE_MS:-600000}
      # 單首最長播放毫秒（試聽約 30 秒；全長不到 30 秒的曲子才更短）
      SONG_PREVIEW_CAP_MS: ${SONG_PREVIEW_CAP_MS:-30000}
    # Linux 需要此對應才解析得到 host.docker.internal；macOS／Windows 的 Docker Desktop 本來就有
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
